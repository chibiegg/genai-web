# 源内 Web AWS 非依存構成（さくらのAI Engine + PostgreSQL + Keycloak + MinIO）
#
# 使い方:
#   cp .env.sakura.example .env.sakura
#   docker compose -f docker-compose.sakura.yml --env-file .env.sakura up -d
#
# ローカル開発時は api を止めて `npm run dev -w server` でホスト実行してもよい。

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: genai
      POSTGRES_PASSWORD: genai
      POSTGRES_DB: genai
    ports:
      - "5432:5432"
    volumes:
      - genai-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genai"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"
    volumes:
      - ./docker/keycloak/realm-genai.json:/opt/keycloak/data/import/realm-genai.json:ro
      - genai-keycloak:/opt/keycloak/data/h2

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - genai-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # バケットの初期作成
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/genai-files &&
      exit 0
      "

  api:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://genai:genai@db:5432/genai
      AUTH_PROVIDER: oidc
      OIDC_ISSUER: ${OIDC_ISSUER:-http://keycloak:8180/realms/genai}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MODEL_PROVIDER: sakura
      MODEL_IDS: ${MODEL_IDS:-["preview/Kimi-K2.6","preview/Qwen3.6-35B-A3B","Qwen3-Coder-480B-A35B-Instruct-FP8"]}
      IMAGE_GENERATION_MODEL_IDS: "[]"
      SAKURA_AI_BASE_URL: ${SAKURA_AI_BASE_URL:-https://api.ai.sakura.ad.jp/v1}
      SAKURA_AI_API_KEY: ${SAKURA_AI_API_KEY}
      BUCKET_NAME: genai-files
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      TTL_DAYS: "364"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  genai-pgdata:
  genai-keycloak:
  genai-minio:
